<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dice Battle Elite</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="particles"></div>

<div id="home-screen" class="home">
  <h1 class="title">🎲 DICE <span>BATTLE</span></h1>
  <p class="tagline">⚡ Roll • Bet • Conquer ⚡</p>

  <div class="login-box">
    <h3>👤 Player Profile</h3>
    <input type="text" id="username-input" placeholder="Enter Nickname..." maxlength="12">
    <button class="connect-btn" onclick="handleSimpleLogin()">🚀 Enter Arena</button>
  </div>

  <div class="wallet-box">
    <div class="wallet-balance">
      <p>💰 Coins: <span id="coins">100</span></p>
      <p>🪙 Tokens: <span id="tokens">0</span></p>
    </div>
    <div class="wallet-actions">
      <button onclick="convertToTokens()">➡️ Convert</button>
      <button onclick="convertToCoins()">⬅️ Redeem</button>
    </div>
  </div>
  
  <p style="margin-top: 20px; font-size: 10px; opacity: 0.5;">No Wallet Required - Offline Mode</p>
</div>

<div id="game-screen" style="display:none;">
  <div class="game-container">
    
    <div class="game-header">
      <div class="user-stats">
          <span id="display-username">Player</span> 
          <span class="badge">LVL <span id="lvl-num">1</span></span>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="players-row">
      <div class="player" id="p1-card">
        <div class="p-label">YOU</div>
        <div class="dice">
            <img id="dice1" src="./assets/red-1.png" alt="dice">
        </div>
        <p class="score-label">Roll: <span id="score1">0</span></p>
      </div>

      <div class="vs">VS</div>

      <div class="player" id="p2-card">
        <div class="p-label">OPPONENT</div>
        <div class="dice">
            <img id="dice2" src="./assets/green-1.png" alt="dice">
        </div>
        <p class="score-label">Roll: <span id="score2">0</span></p>
      </div>
    </div>

    <div class="status-bar">
        <div id="streak-info">🔥 Streak: <span id="win-streak">0</span></div>
        <div id="multiplier-info">Bonus: <span id="multiplier">1x</span></div>
    </div>

    <div class="bet-section">
      <label style="font-size: 12px; opacity: 0.7;">Enter Bet Amount</label>
      <input type="number" id="bet" value="10" min="1">
      
      <div class="roll-buttons">
        <button id="roll" class="btn-main standard">🎲 Standard</button>
        <button id="berserk" class="btn-main berserk">⚡ Berserk</button>
      </div>
    </div>

    <div class="shop">
        <button id="shield-btn" class="btn-shop" onclick="buyPowerUp('shield')" title="Protects 50% of loss">🛡️ Shield (20c)</button>
        <button id="loaded-btn" class="btn-shop" onclick="buyPowerUp('loaded')" title="Min roll becomes 3">🎲 Loaded (30c)</button>
    </div>

    <div class="footer-stats">
      <p>Balance: <span style="color: #fbbf24; font-weight: bold;">💰 <span id="coins-game">100</span></span></p>
      <p class="result">Ready to Battle?</p>
    </div>

  </div>
</div>

<div id="coin-animation"></div>

<script src="main.js"></script>

</body>
</html>
