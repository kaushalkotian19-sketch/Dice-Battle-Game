<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Battle Elite</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="particles"></div>

<div id="home-screen" class="home">
  <h1 class="title">🎲 DICE <span>BATTLE</span></h1>
  <p class="tagline">⚡ Roll • Bet • Conquer ⚡</p>

  <div class="login-box">
    <h3>👤 Enter the Arena</h3>
    <button class="connect-btn" onclick="connectWallet()">🦊 Connect MetaMask</button>
    <p id="wallet-address">Not connected</p>
  </div>

  <div class="wallet-box">
    <div class="wallet-balance">
      <p>💰 Coins: <span id="coins">100</span></p>
      <p>🪙 Tokens: <span id="tokens">0</span></p>
    </div>
    <div class="wallet-actions">
      <button onclick="convertToTokens()">➡️ Tokenize</button>
      <button onclick="convertToCoins()">⬅️ Redeem</button>
    </div>
  </div>
</div>

<div id="game-screen" style="display:none;">
  <div class="game-header">
    <div class="user-stats">
        <span id="display-username">Player</span> 
        <span class="badge">LVL <span id="lvl-num">1</span></span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="game">
    <div class="players-row">
      <div class="player player1" id="p1-card">
        <div class="p1">YOU</div>
        <div class="dice"><img id="dice1" src="./assets/red-1.png"></div>
        <p>Roll: <span id="score1">0</span></p>
      </div>

      <div class="vs">VS</div>

      <div class="player player2" id="p2-card">
        <div class="p2">OPPONENT</div>
        <div class="dice"><img id="dice2" src="./assets/green-1.png"></div>
        <p>Roll: <span id="score2">0</span></p>
      </div>
    </div>

    <div class="status-bar">
        <div id="streak-info">Streak: 🔥 <span id="win-streak">0</span></div>
        <div id="multiplier-info">Bonus: <span id="multiplier">1x</span></div>
    </div>

    <div class="bet-box">
      <input type="number" id="bet" placeholder="Bet Amount" min="1">
      <button id="roll">🎲 ROLL DICE</button>
    </div>

    <div class="powerup-shop">
        <button onclick="buyPowerUp('shield')" title="Protects 50% of loss">🛡️ Shield (20c)</button>
        <button onclick="buyPowerUp('loaded')" title="Min roll becomes 3">🎲 Loaded (30c)</button>
    </div>

    <p class="coins">Balance: 💰 <span id="coins-game">100</span></p>
    <p class="result">Place your bet!</p>
  </div>
</div>

<div id="coin-animation"></div>
<script src="main.js"></script>
</body>
</html>
