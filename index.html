<div id="home-screen" class="home">
  <h1 class="title">🎲 DICE <span>BATTLE</span></h1>
  <p class="tagline">⚡ Roll • Bet • Win ⚡</p>

  <div class="login-box">
    <h3>👤 Welcome to the Arena</h3>
    <input type="text" id="username-input" placeholder="Enter your name">
    <button id="start-btn" onclick="handleSimpleLogin()">🚀 Enter Game</button>
    <p class="coins">💰 Starting Balance: 100</p>
  </div>

  <div class="wallet-box">
    <h3>💼 Local Wallet</h3>
    <div class="wallet-balance">
      <p>💰 Coins: <span id="coins">100</span></p>
      <p>🪙 Tokens: <span id="tokens">0</span></p>
    </div>
    <div class="wallet-actions">
      <button onclick="convertToTokens()">➡️ Convert (10:1)</button>
      <button onclick="convertToCoins()">⬅️ Redeem (1:10)</button>
    </div>
  </div>
</div>
